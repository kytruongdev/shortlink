global:
  scrape_interval: 15s

scrape_configs:
  # Host hardware: CPU, memory, disk, network.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # PostgreSQL status: up, connections, database size, transactions.
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
