<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <style>
      .t{fill:#1f2733;font-size:13px;font-weight:600;text-anchor:middle;}
      .s{fill:#5b6472;font-size:11px;text-anchor:middle;}
      .lbl{fill:#5b6472;font-size:10.5px;text-anchor:middle;}
      .edge{stroke:#5b6472;stroke-width:1.6;fill:none;}
      .title{fill:#111827;font-size:19px;font-weight:700;text-anchor:middle;}
      .cap{fill:#6b7280;font-size:12px;text-anchor:middle;}
      .zone{fill:#f6f8fb;stroke:#c3ccd8;stroke-width:1.4;stroke-dasharray:6 5;}
      .ztext{fill:#7a8699;font-size:12px;font-weight:700;}
      .badge{fill:#3b82f6;}
      .bnum{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;}
    </style>
  </defs>

  <text x="480" y="30" class="title">Runtime architecture — single VPS</text>
  <text x="480" y="50" class="cap">Request path ① → ④   ·   Metrics ⑤ → ⑥</text>

  <!-- VPS zone -->
  <rect x="176" y="70" width="764" height="374" rx="14" class="zone"/>
  <text x="192" y="93" class="ztext">DigitalOcean Droplet · Ubuntu · Docker Compose</text>

  <!-- User -->
  <rect x="18" y="112" width="112" height="56" rx="10" fill="#eef2f7" stroke="#9aa7b8"/>
  <text x="74" y="137" class="t">User</text>
  <text x="74" y="154" class="s">Browser</text>

  <!-- request path -->
  <rect x="206" y="112" width="140" height="56" rx="10" fill="#e6f7f4" stroke="#2fae9b"/>
  <text x="276" y="137" class="t">Caddy</text>
  <text x="276" y="154" class="s">:80/:443 · TLS</text>

  <rect x="404" y="112" width="158" height="56" rx="10" fill="#e7f0fd" stroke="#3b82f6"/>
  <text x="483" y="137" class="t">Frontend (nginx)</text>
  <text x="483" y="154" class="s">SPA + /api proxy</text>

  <rect x="620" y="112" width="146" height="56" rx="10" fill="#e7f0fd" stroke="#3b82f6"/>
  <text x="693" y="137" class="t">Backend</text>
  <text x="693" y="154" class="s">Go API :8080</text>

  <rect x="812" y="112" width="112" height="56" rx="10" fill="#e8f6ec" stroke="#34a853"/>
  <text x="868" y="137" class="t">PostgreSQL</text>
  <text x="868" y="154" class="s">data</text>

  <!-- arrows + numbered badges -->
  <line x1="130" y1="140" x2="204" y2="140" class="edge" marker-end="url(#arw)"/>
  <circle cx="167" cy="140" r="10" class="badge"/><text x="167" y="144" class="bnum">1</text>
  <text x="167" y="122" class="lbl">HTTPS</text>

  <line x1="346" y1="140" x2="402" y2="140" class="edge" marker-end="url(#arw)"/>
  <circle cx="374" cy="140" r="10" class="badge"/><text x="374" y="144" class="bnum">2</text>

  <line x1="562" y1="140" x2="618" y2="140" class="edge" marker-end="url(#arw)"/>
  <circle cx="590" cy="140" r="10" class="badge"/><text x="590" y="144" class="bnum">3</text>
  <text x="590" y="122" class="lbl">/api</text>

  <line x1="766" y1="140" x2="810" y2="140" class="edge" marker-end="url(#arw)"/>
  <circle cx="788" cy="140" r="10" class="badge"/><text x="788" y="144" class="bnum">4</text>
  <text x="788" y="122" class="lbl">SQL</text>

  <!-- monitoring -->
  <text x="192" y="238" class="ztext">Monitoring</text>
  <rect x="206" y="252" width="176" height="46" rx="10" fill="#fdf0e6" stroke="#e08a3c"/>
  <text x="294" y="272" class="t">node_exporter</text>
  <text x="294" y="288" class="s">host CPU/RAM/disk</text>

  <rect x="206" y="312" width="176" height="46" rx="10" fill="#fdf0e6" stroke="#e08a3c"/>
  <text x="294" y="332" class="t">postgres_exporter</text>
  <text x="294" y="348" class="s">database status</text>

  <rect x="452" y="282" width="150" height="48" rx="10" fill="#f1ecfb" stroke="#8b5cf6"/>
  <text x="527" y="303" class="t">Prometheus</text>
  <text x="527" y="319" class="s">:9090</text>

  <rect x="672" y="282" width="150" height="48" rx="10" fill="#f1ecfb" stroke="#8b5cf6"/>
  <text x="747" y="303" class="t">Grafana</text>
  <text x="747" y="319" class="s">:3000 · dashboards</text>

  <line x1="382" y1="275" x2="450" y2="300" class="edge" marker-end="url(#arw)"/>
  <circle cx="416" cy="286" r="10" class="badge"/><text x="416" y="290" class="bnum">5</text>
  <line x1="382" y1="335" x2="450" y2="312" class="edge" marker-end="url(#arw)"/>
  <line x1="602" y1="306" x2="670" y2="306" class="edge" marker-end="url(#arw)"/>
  <circle cx="636" cy="306" r="10" class="badge"/><text x="636" y="310" class="bnum">6</text>
</svg>
