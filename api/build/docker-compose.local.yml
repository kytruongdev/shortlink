services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable",
        "up",
      ]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable"
      BASE_URL: "http://localhost:5173"
      LOG_LEVEL: "info"
      JWT_SECRET: "local-dev-jwt-secret-change-me-please-0123456789"
      ACCESS_TOKEN_TTL: "5m"
      REFRESH_TOKEN_TTL: "168h"
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "8080:8080"

volumes:
  pgdata:
