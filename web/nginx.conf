# Single-origin server: serve the SPA and reverse-proxy the API to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + Swagger go to the Go backend (same Docker network).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every other path is handled by the client-side router
    # (including short codes like /abc123, which the app resolves and redirects).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
